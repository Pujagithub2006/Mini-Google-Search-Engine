<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Google Search Engine</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <head>
    <!-- Your existing meta tags -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.3/dist/tesseract.min.js"></script>
    <!-- Your existing styles -->
</head>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="nav-links">
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">Store</a>
            </div>
            <div class="user-menu">
                <div class="auth-buttons">
                    <button class="signin-btn" onclick="showLoginModal()">Sign in</button>
                    <button class="signup-btn" onclick="showSignupModal()">Sign up</button>
                </div>
                <button class="apps-btn" title="Google apps">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
                <div class="profile-pic" onclick="toggleThreeDotsMenu()">
                    <span class="user-avatar">G</span>
                </div>
                <!-- Three Dots Menu -->
                <div class="three-dots-menu">
                    <button class="menu-item" onclick="toggleSearchHistory()">
                        <i class="fas fa-history"></i>
                        Search History
                    </button>
                    <button class="menu-item" onclick="clearSearchHistory()">
                        <i class="fas fa-trash"></i>
                        Clear History
                    </button>
                    <div class="menu-divider"></div>
                    <!-- Show logout only when logged in -->
                    <button class="menu-item" id="logoutMenuItem" onclick="logoutUser()" style="display: none;">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </button>
                    <!-- Show login/signup only when not logged in -->
                    <button class="menu-item" id="loginMenuItem" onclick="showLoginModal()">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                    <button class="menu-item" id="signupMenuItem" onclick="showSignupModal()">
                        <i class="fas fa-user-plus"></i>
                        Sign Up
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo">
                    <img src="logo.png" alt="Mini Google" class="logo-img">
                    <h1 class="logo-text">Mini <span class="google-text">Search</span></h1>
                </div>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-container">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search Mini Google or type a URL" autocomplete="off">
                        <div class="search-actions">
                            <button class="mic-btn" title="Search by voice">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button class="camera-btn" title="Search by image">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Suggestions Dropdown -->
                    <div class="suggestions-dropdown" id="suggestionsDropdown">
                        <!-- Dynamic suggestions will be populated here -->
                    </div>
                </div>

                <!-- Search Buttons -->
                <div class="search-buttons">
                    <button class="search-btn" onclick="performSearch()">Mini Google Search</button>
                    <button class="lucky-btn" onclick="feelingLucky()">I'm Feeling Lucky</button>
                </div>
            </div>

            <!-- Search History Section -->
            <div class="search-history" id="searchHistory" style="display: none;">
                <div class="history-header">
                    <h3><i class="fas fa-history"></i> Search History</h3>
                    <div class="history-actions">
                        <button class="clear-history-btn" onclick="clearSearchHistory()">
                            <i class="fas fa-trash"></i> Clear All
                        </button>
                        <button class="close-history-btn" onclick="toggleSearchHistory()">
                            <i class="fas fa-times"></i> Close
                        </button>
                    </div>
                </div>
                <div class="history-items" id="historyItems">
                    <!-- History items will be populated here -->
                </div>
            </div>

            <!-- Results Section -->
            <section id="resultsSection" class="results-section" style="display: none;">
                <div class="container">
                    <div id="resultsCount" class="results-count"></div>
                    
                    <!-- Image Search Results Container - ADDED THIS -->
                    <div id="imageSearchResults" class="image-search-results" style="display: none;"></div>
                    
                    <div id="resultsContainer" class="results-container">
                        <!-- Regular search results will be populated here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-left">
                    <a href="#" class="footer-link">Advertising</a>
                    <a href="#" class="footer-link">Business</a>
                    <a href="#" class="footer-link">How Search works</a>
                </div>
                <div class="footer-center">
                    <a href="#" class="footer-link">
                        <i class="fas fa-leaf"></i> Carbon neutral since 2007
                    </a>
                </div>
                <div class="footer-right">
                    <a href="#" class="footer-link">Privacy</a>
                    <a href="#" class="footer-link">Terms</a>
                    <a href="#" class="footer-link">Settings</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner" style="display: none;">
        <div class="spinner"></div>
        <p>Searching...</p>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <script src="script.js"></script>
</body>
</html>
